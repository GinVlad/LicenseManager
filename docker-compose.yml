version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licensemanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - '8080:8080'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c 'npm install && npm run dev -- --host'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8080

volumes:
  pgdata:
